<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batcave</title>
<style>
/* The Grid, quietly: near-black, hairline frames, one cool accent for live work, one warm accent for what needs you. */
:root{--bg:#07090C;--panel:#0C1116;--panel2:#111920;--line:rgba(140,200,212,.12);--line2:rgba(140,200,212,.26);
  --fg:#D3DCE0;--muted:#8597A0;--dim:#4D5D66;--cy:#7CCFDC;--amb:#D6A160;--ok:#8DC5A0;--warn:#D7896C;
  --mono:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.55 var(--mono);
  background-image:linear-gradient(rgba(140,200,212,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(140,200,212,.025) 1px,transparent 1px);background-size:32px 32px}
::selection{background:rgba(124,207,220,.25)}
:focus-visible{outline:1px solid var(--cy);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 24px;height:56px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:rgba(7,9,12,.85);position:sticky;top:0;z-index:5;backdrop-filter:blur(8px)}
h1{font:500 13px var(--mono);letter-spacing:.24em;text-transform:uppercase;margin:0;color:var(--cy);display:flex;align-items:center;gap:10px}
h1::before{content:'';width:3px;height:16px;background:var(--cy)}
h1 .meta{letter-spacing:.02em;text-transform:none}
nav{display:flex;gap:2px}
nav button,.chip{border:none;background:none;padding:0 12px;height:56px;color:var(--muted);font:inherit;cursor:pointer;border-bottom:1px solid transparent;margin-bottom:-1px;text-transform:lowercase}
nav button:hover{color:var(--fg)}
nav button[aria-current=page]{color:var(--fg);border-bottom-color:var(--cy)}
.who{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
input,textarea,select{font:inherit;border:1px solid var(--line);border-radius:2px;padding:0 10px;height:34px;background:var(--panel);color:var(--fg)}
input::placeholder{color:var(--dim)}
input:focus{border-color:var(--line2);outline:none}
textarea{height:auto;padding:10px 12px}
.btn{height:34px;padding:0 14px;border-radius:2px;border:1px solid var(--line2);background:transparent;color:var(--fg);font:inherit;cursor:pointer;text-transform:lowercase;letter-spacing:.02em}
.btn:hover{border-color:var(--cy);color:var(--cy)}
.btn.primary{border-color:rgba(124,207,220,.5);color:var(--cy);background:rgba(124,207,220,.06)}
.btn.clay{border-color:var(--line2);color:var(--muted);background:transparent}
.btn.clay:hover{border-color:var(--cy);color:var(--cy)}
.btn.small{height:28px;font-size:12px;padding:0 10px;align-self:flex-start}
main{padding:24px}
.lanes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:start}
@media(max-width:1100px){.lanes{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.lanes{grid-template-columns:1fr}}
.lane{border:1px solid var(--line);background:rgba(12,17,22,.6);border-radius:2px;padding:10px;display:flex;flex-direction:column;gap:8px}
.lane h2{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:2px 2px 4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.lane h2::after{content:'';flex:1;height:1px;background:var(--line);order:1}
.lane h2 span{order:2;color:var(--dim);font-weight:400;letter-spacing:0}
.lane[data-lane=running] h2{color:var(--cy)}
.lane[data-lane=review] h2{color:var(--amb)}
.card{background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--line2);border-radius:2px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.card[data-status=running]{border-left-color:var(--cy)}
.card[data-status=review]{border-left-color:var(--amb)}
.card[data-status=done]{opacity:.6}
.card.stale{border-style:dashed;border-left-style:solid;border-left-color:var(--warn)}
.meta{font-size:11px;color:var(--dim)}
.mono{font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.title{font-weight:500;color:var(--fg)}
.av{width:22px;height:22px;border-radius:50%;border:1px solid currentColor;background:transparent;font-size:9px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;flex:none}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:16px;display:flex;flex-direction:column;gap:12px}
.pcard[data-presence="agent running"]{border-top:1px solid var(--cy)}
.badge{font-size:11px;border-radius:2px;padding:2px 8px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.run{border-color:rgba(124,207,220,.45);color:var(--cy)}
.badge.on{border-color:rgba(141,197,160,.35);color:var(--ok)}
.badge.dup{border-color:rgba(214,161,96,.4);color:var(--amb)}
.now{border-left:1px solid var(--line2);padding:2px 0 2px 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding-top:10px}
.stats b{display:block;font:400 20px var(--mono);color:var(--fg)}
.rooms{display:grid;grid-template-columns:220px minmax(0,1fr);gap:12px}
@media(max-width:800px){.rooms{grid-template-columns:1fr}}
.roomlist{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:2px;padding:6px;align-self:start;background:var(--panel)}
.roomlist button{display:block;width:100%;text-align:left;padding:7px 10px;border:none;border-left:2px solid transparent;background:none;font:inherit;cursor:pointer;color:var(--muted)}
.roomlist button:hover{color:var(--fg)}
.roomlist button[aria-current=true]{color:var(--fg);border-left-color:var(--cy);background:rgba(124,207,220,.04)}
.msgs{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:420px}
.msg.event{color:var(--dim);font-size:12px}
.msg.event::before{content:'· '}
.msg .author{color:var(--fg)}
.msg.agent .author{color:var(--cy)}
.msg.agent{border-left:1px solid rgba(124,207,220,.35);padding-left:10px}
.msg.alfred{border:1px solid var(--line);border-left:2px solid var(--amb);background:rgba(214,161,96,.03);padding:8px 12px}
.msg.alfred .author{color:var(--amb);letter-spacing:.06em}
.fb{display:flex;gap:6px}
.sr{position:absolute;left:-9999px}
.empty{color:var(--dim);padding:8px 2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.tile b{display:block;font:400 26px var(--mono);font-variant-numeric:tabular-nums;color:var(--fg)}
.tile:first-child b{color:var(--cy)}
.panel2{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:16px;margin-bottom:14px;overflow-x:auto}
.panel2 h3{margin:0 0 12px;font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
table.lat{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:12px}
table.lat td,table.lat th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.lat th{color:var(--dim);font-weight:400}
table.lat td:first-child,table.lat th:first-child{text-align:left;color:var(--muted)}
.barcell{width:40%}
.bar{height:4px;background:rgba(140,200,212,.08);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--cy)}
.bar i.p95{background:var(--cy);opacity:.3}
.days{display:flex;align-items:flex-end;gap:6px;height:120px;border-bottom:1px solid var(--line)}
.days div{flex:1;max-width:40px;display:flex;flex-direction:column;justify-content:flex-end;gap:1px;min-width:10px}
.days span{display:block}
.suggest{margin-top:6px}
.roomcard{border:1px solid var(--line);border-left:2px solid var(--cy);background:rgba(124,207,220,.025);padding:12px 14px;display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.roomcard .kv{display:grid;grid-template-columns:80px minmax(0,1fr);gap:10px;font-size:12px}
.roomcard .kv>span:first-child{color:var(--dim)}
</style>
</head>
<body>
<header>
  <div class="row" style="gap:20px">
    <h1>Batcave <span id="team" class="meta"></span></h1>
    <nav aria-label="Views">
      <button data-view="board" aria-current="page">Board</button>
      <button data-view="people">People</button>
      <button data-view="rooms">Rooms</button>
      <button data-view="decisions">Decisions</button>
      <button data-view="stats">Stats</button>
    </nav>
  </div>
  <form class="who" id="whoForm">
    <label class="sr" for="uid">Your handle</label><input id="uid" placeholder="handle (e.g. aman)" size="12">
    <label class="sr" for="uname">Display name</label><input id="uname" placeholder="name" size="10">
    <label class="sr" for="utoken">Team token</label><input id="utoken" type="password" placeholder="team token" size="12">
    <button class="btn small" type="submit">Save</button>
  </form>
</header>
<main id="app"><p class="empty">Loading…</p></main>
<script>
const S = { view: 'board', room: 'team', state: null, messages: [] };
const ls = { get(k){ try { return localStorage.getItem(k) || ''; } catch { return S['_'+k] || ''; } }, set(k,v){ try { localStorage.setItem(k,v); } catch { S['_'+k]=v; } } };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TOOLS = { claude: 'Claude Code', codex: 'Codex', gemini: 'Gemini CLI', antigravity: 'Antigravity', cursor: 'Cursor', copilot: 'Copilot CLI', opencode: 'OpenCode', cli: 'terminal' };
const AV = ['#7CCFDC','#D6A160','#B9C6CC','#8DC5A0','#A9A3D6','#C99AA6'];
const avColor = (id) => { let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return `color:${AV[h % AV.length]}`; };
const initials = (n) => esc(String(n||'?').split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase());
const ago = (t) => { const m = Math.round((Date.now()-t)/60000); return m<1?'now':m<60?m+'m':m<1440?Math.round(m/60)+'h':Math.round(m/1440)+'d'; };

function headers(){ return { 'content-type':'application/json', 'x-batcave-user': ls.get('uid'), 'x-batcave-name': encodeURIComponent(ls.get('uname')||ls.get('uid')), authorization: 'Bearer '+ls.get('utoken') }; }
async function api(method, path, body){
  const r = await fetch(path, { method, headers: headers(), body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

async function refresh(){
  if (!ls.get('uid')) { document.getElementById('app').innerHTML = '<p class="empty">Enter your handle, name and team token above to join.</p>'; return; }
  try {
    S.state = await api('GET','/api/state');
    document.getElementById('team').textContent = '· ' + S.state.team;
    if (S.view === 'rooms') S.messages = await api('GET', `/api/rooms/${encodeURIComponent(S.room)}/messages?limit=100`);
    if (S.view === 'stats') S.stats = await api('GET', '/api/stats');
    render();
  } catch (e) { document.getElementById('app').innerHTML = `<p class="empty">Could not load: ${esc(e.message)}</p>`; }
}

const nameOf = (id) => S.state.people.find(p=>p.id===id)?.name || id;
const LANES = [['backlog','Backlog'],['claimed','Claimed'],['running','Agent running'],['review','In review'],['done','Done']];

function taskCard(t){
  const owner = t.owner ? `<div class="row"><span class="av" style="${avColor(t.owner)}">${initials(nameOf(t.owner))}</span><span class="meta">${esc(nameOf(t.owner))}${t.stale?' · no activity '+ago(t.lastActivity):''}${t.paused?' · paused':''}</span></div>` : '';
  const action = t.status==='backlog' ? `<button class="btn clay small" data-claim="${esc(t.id)}">claim</button>`
    : t.stale && t.owner!==ls.get('uid') ? `<button class="btn small" data-claim="${esc(t.id)}" data-force="1">take over</button>` : '';
  return `<article class="card${t.stale?' stale':''}" data-status="${esc(t.status)}">
    <div class="meta">${esc(t.id)} · ${esc(t.source)}</div>
    <div class="title">${esc(t.title)}</div>
    ${t.duplicateOf?`<div class="meta"><span class="badge dup">possible duplicate of ${esc(t.duplicateOf.task)}</span></div>`:''}
    ${t.branch?`<div class="mono">${esc(t.branch)}</div>`:''}
    ${t.pr?`<div class="mono">${esc(t.pr)}</div>`:''}
    ${owner}${action}
  </article>`;
}

function renderBoard(){
  const tasks = S.state.tasks;
  return `<form id="newTask" class="row" style="margin-bottom:16px">
      <label class="sr" for="nt">New task</label><input id="nt" placeholder="New task title" style="flex:1;min-width:220px">
      <button class="btn primary" type="submit">Add to backlog</button></form>
    <div class="lanes">${LANES.map(([k,label])=>{
      const list = tasks.filter(t=>t.status===k).sort((a,b)=>b.updatedAt-a.updatedAt);
      return `<section class="lane" data-lane="${k}" aria-label="${label}"><h2>${label} <span>${list.length}</span></h2>${list.map(taskCard).join('') || '<div class="empty">·</div>'}</section>`;
    }).join('')}</div>`;
}

function renderPeople(){
  const me = ls.get('uid');
  const order = {'agent running':0, online:1, away:2, offline:3};
  const people = [...S.state.people].sort((a,b)=>(order[a.presence]-order[b.presence]) || a.name.localeCompare(b.name));
  if (!people.length) return '<p class="empty">No one has joined yet.</p>';
  return `<div class="people">${people.map(p=>{
    const badge = p.presence==='agent running'?'<span class="badge run">agent running</span>':p.presence==='online'?'<span class="badge on">online</span>':`<span class="badge">${esc(p.presence)}</span>`;
    const task = S.state.tasks.find(t=>t.id===p.task);
    return `<article class="pcard" data-presence="${esc(p.presence)}">
      <div class="row"><span class="av" style="width:36px;height:36px;font-size:12px;${avColor(p.id)}">${initials(p.name)}</span>
        <div style="flex:1"><div class="title">${esc(p.name)}${p.id===me?' <span class="meta">(you)</span>':''}</div><div class="meta">${esc(p.role||p.id)}${p.tool?' · '+esc(TOOLS[p.tool]||p.tool):''}${p.autoWeighIn?' · auto weigh-in':''}</div></div>${badge}</div>
      <div class="now"><div class="meta">Now · ${ago(p.since||p.lastSeen)}</div><div>${esc(p.now||'idle')}</div>${task?`<div class="mono">${esc(task.id)} · ${esc(task.branch||task.title)}</div>`:''}</div>
      <div class="stats"><div><b>${p.stats.shipped}</b><span class="meta">shipped</span></div><div><b>${p.stats.prsOpen}</b><span class="meta">PRs open</span></div><div><b>${p.stats.reviewsOwed}</b><span class="meta">reviews owed</span></div></div>
      ${p.id===me?`<div class="row" style="justify-content:space-between"><span class="meta">auto weigh-in · ${p.autoWeighIn?'Alfred can bring your agent into rooms':'Alfred asks first'}</span><button class="btn small" data-auto="${p.autoWeighIn?'0':'1'}">${p.autoWeighIn?'turn off':'turn on'}</button></div>`:''}
      ${p.id!==me?`<form class="row" data-ask="${esc(p.id)}"><label class="sr" for="ask-${esc(p.id)}">Ask ${esc(p.name)}'s agent</label><input id="ask-${esc(p.id)}" placeholder="Ask ${esc(p.name)}'s agent…" style="flex:1"><button class="btn small" type="submit">Request</button></form>`:''}
    </article>`;}).join('')}</div>`;
}

function roomCard(r){
  if (!r || r.id==='team') return '';
  const me = ls.get('uid'); const member = r.members.includes(me);
  const run = Object.entries(r.run||{}).filter(([k,v])=>v&&v.length);
  return `<section class="roomcard" aria-label="Room details">
    <div class="row" style="justify-content:space-between"><div><b>#${esc(r.name)}</b> <span class="meta">${esc(r.id)}${r.tasks?.length?' · '+esc(r.tasks.join(', ')):''}</span></div>
      <div class="row">${member?`<button class="btn small" data-rename="${esc(r.id)}">rename</button>`:`<button class="btn small primary" data-join="${esc(r.id)}">join</button>`}</div></div>
    <div class="kv"><span>branch</span><span class="mono">${esc(r.branch||'not set')}</span></div>
    <div class="kv"><span>members</span><span>${r.members.map(m=>`${esc(nameOf(m))}${r.slices?.[m]?` <span class="mono">${esc(r.slices[m].name||r.slices[m].paths.join(' '))}</span>`:''}`).join(' · ')||'none'}</span></div>
    ${run.map(([k,v])=>`<div class="kv"><span>${esc(k)}</span><span class="mono">${esc(Array.isArray(v)?v.join(', '):v)}</span></div>`).join('')}
    ${r.rules?`<div class="kv"><span>rules</span><span style="white-space:pre-wrap">${esc(r.rules)}</span></div>`:''}
    ${r.pushes?.length?`<div class="kv"><span>pushes</span><span class="mono">${r.pushes.slice(-3).reverse().map(p=>`${esc(nameOf(p.by))} ${esc(p.sha.slice(0,7))} · ${p.files.length} files · ${ago(p.at)}`).join('<br>')}</span></div>`:''}
    ${member?`<form class="row" data-invite="${esc(r.id)}"><label class="sr" for="inv">Invite</label><input id="inv" placeholder="invite @handle" style="flex:1"><button class="btn small" type="submit">invite</button></form>`:''}
  </section>`;
}

function renderRooms(){
  const rooms = S.state.rooms;
  const me = ls.get('uid');
  const mine = rooms.filter(r=>r.id==='team'||r.members?.includes(me)), others = rooms.filter(r=>!mine.includes(r));
  const item = (r)=>`<button data-room="${esc(r.id)}" aria-current="${r.id===S.room}">#${esc(r.name)}</button>`;
  return `<div class="rooms"><nav class="roomlist" aria-label="Rooms">${mine.map(item).join('')}${others.length?`<div class="meta" style="padding:8px 10px 2px">other rooms</div>${others.map(item).join('')}`:''}
      <form id="newRoom" class="row" style="padding:8px 4px 2px"><label class="sr" for="nr">New room</label><input id="nr" placeholder="new room" style="flex:1;min-width:0"></form></nav>
    <section class="msgs" aria-label="#${esc(S.room)}">
      ${roomCard(rooms.find(r=>r.id===S.room))}
      ${S.messages.map(m=>m.meta?.invocation!=null?alfredMsg(m):`<div class="msg ${esc(m.kind)}">${m.kind==='event'?`${esc(nameOf(m.author))} ${esc(m.text)} · ${ago(m.at)}`:`<span class="author">${esc(nameOf(m.author))}${m.kind==='agent'?"'s agent":''}</span> <span class="meta">${ago(m.at)}</span><div>${esc(m.text)}</div>${m.meta && m.meta.suggestPin && !m.meta.pinned ? `<button class="btn small suggest" data-pin="${m.id}">Pin as decision</button>` : ''}`}</div>`).join('') || '<p class="empty">No messages yet.</p>'}
      <form id="say" class="row" style="margin-top:auto"><label class="sr" for="sayInput">Message #${esc(S.room)}</label><input id="sayInput" placeholder="Message #${esc(S.room)} · @alfred brings in your agent · @name-agent asks theirs" style="flex:1"><button class="btn primary" type="submit">Send</button></form>
    </section></div>`;
}

function alfredMsg(m){
  const mine = m.meta?.feedback?.[ls.get('uid')];
  const fb = mine === undefined
    ? `<span class="fb"><button class="btn small" data-fb="${m.id}" data-helpful="1">helpful</button><button class="btn small" data-fb="${m.id}" data-helpful="0">not helpful</button></span>`
    : `<span class="meta">${mine ? 'marked helpful' : 'marked not helpful'}</span>`;
  return `<div class="msg alfred"><span class="author">${esc(nameOf(m.author))}'s agent</span> <span class="meta">${ago(m.at)} · via alfred</span><div>${esc(m.text)}</div><div class="row" style="margin-top:6px">${fb}</div></div>`;
}

function renderDecisions(){
  return `<form id="decide" class="row" style="margin-bottom:16px"><label class="sr" for="dec">New decision</label><input id="dec" placeholder="Pin a decision for every agent" style="flex:1"><button class="btn primary" type="submit">Pin</button></form>
    <div class="msgs" style="min-height:0">${S.state.decisions.map(d=>`<div class="row" style="justify-content:space-between"><div>${esc(d.text)} <span class="meta">#${esc(d.room)} · ${esc(nameOf(d.author))} · ${ago(d.at)}</span></div><button class="btn small" data-retire="${d.id}">Retire</button></div>`).join('') || '<p class="empty">No decisions pinned.</p>'}</div>`;
}

function renderStats(){
  const s = S.stats; if (!s) return '<p class="empty">Loading…</p>';
  const n = (x) => Number(x || 0).toLocaleString('en-US'); const t = s.tokens; const c = s.counters || {};
  const lat = Object.entries(s.latency).filter(([k]) => /^(hook|alfred|agent)|api:GET \/api\/(context|guard)/.test(k)).sort();
  const max = Math.max(1, ...lat.map(([, v]) => v.p95 || 0));
  const days = Object.entries(s.daily || {}).sort().slice(-14);
  const dmax = Math.max(1, ...days.map(([, d]) => d.injected + d.saved));
  return `<div class="tiles">
      <div class="tile"><span class="meta">Tokens saved</span><b>${n(t.saved)}</b><span class="meta">${t.savedPct}% of what agents would have received</span></div>
      <div class="tile"><span class="meta">Injected into agents</span><b>${n(t.injected)}</b><span class="meta">team context sent</span></div>
      <div class="tile"><span class="meta">Saved by dedupe</span><b>${n(t.savedDedupe)}</b><span class="meta">unchanged context not resent</span></div>
      <div class="tile"><span class="meta">Saved by ranking</span><b>${n(t.savedRanking)}</b><span class="meta">irrelevant notes left out</span></div>
      <div class="tile"><span class="meta">Alfred</span><b style="font-size:22px">${s.alfred.ready ? 'Ready' : s.alfred.enabled ? 'Not running' : 'Off'}</b><span class="meta">${s.alfred.ready ? esc(`${s.alfred.model} on ${s.alfred.device}`) : 'plain rules in use'}</span></div>
    </div>
    <section class="panel2" aria-label="Latency"><h3>Latency</h3>
      ${lat.length ? `<table class="lat"><thead><tr><th>Where</th><th>Count</th><th>p50 ms</th><th>p95 ms</th><th class="barcell"></th></tr></thead><tbody>
      ${lat.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${n(v.count)}</td><td>${v.p50 ?? '-'}</td><td>${v.p95 ?? '-'}</td><td class="barcell"><div class="bar"><i class="p95" style="width:${(v.p95||0)/max*100}%"></i><i style="width:${(v.p50||0)/max*100}%"></i></div></td></tr>`).join('')}
      </tbody></table>` : '<p class="empty">No timings yet. They appear as agents run hooks.</p>'}
    </section>
    <section class="panel2" aria-label="Tokens per day"><h3>Tokens per day</h3>
      ${days.length ? `<div class="days">${days.map(([d, v]) => `<div title="${esc(d)}: ${n(v.injected)} injected, ${n(v.saved)} saved"><span style="height:${v.saved/dmax*100}px;background:var(--cy);opacity:.55"></span><span style="height:${v.injected/dmax*100}px;background:var(--dim)"></span></div>`).join('')}</div>
      <p class="meta" style="margin-top:8px">Grey: injected. Cyan: saved.</p>` : '<p class="empty">No data yet.</p>'}
    </section>
    <section class="panel2" aria-label="Activity"><h3>Activity</h3>
      <p>${n(c.claims)} claims · ${n(c.guard_checks)} guard checks (${n(c.guard_conflicts)} conflicts) · ${n(c.requests)} requests · ${n(c.handoffs)} handoffs · ${n(c.decisions)} decisions · ${n(c.alfred_rank)} rankings · ${n(c.alfred_classify)} messages classified</p>
    </section>`;
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = ({board:renderBoard, people:renderPeople, rooms:renderRooms, decisions:renderDecisions, stats:renderStats})[S.view]();
}

document.addEventListener('click', async (e) => {
  const v = e.target.closest('[data-view]');
  if (v) { S.view = v.dataset.view; document.querySelectorAll('nav [data-view]').forEach(b=>b.removeAttribute('aria-current')); v.setAttribute('aria-current','page'); return refresh(); }
  const c = e.target.closest('[data-claim]');
  if (c) { try { await api('POST', `/api/tasks/${c.dataset.claim}/claim`, { force: !!c.dataset.force }); } catch(err){ alertBox(err.message); } return refresh(); }
  const r = e.target.closest('[data-room]');
  if (r) { S.room = r.dataset.room; return refresh(); }
  const pin = e.target.closest('[data-pin]');
  if (pin) { const m = S.messages.find(x => String(x.id) === pin.dataset.pin); if (m) await api('POST','/api/decisions',{ text: m.text, room: m.room, fromMessage: m.id }); return refresh(); }
  const jn = e.target.closest('[data-join]');
  if (jn) { await api('POST', `/api/rooms/${jn.dataset.join}/join`, {}); return refresh(); }
  const rn = e.target.closest('[data-rename]');
  if (rn) { const name = prompt('New room name'); if (name && name.trim()) await api('POST', `/api/rooms/${rn.dataset.rename}/rename`, { name }); return refresh(); }
  const fb = e.target.closest('[data-fb]');
  if (fb) { await api('POST', `/api/messages/${fb.dataset.fb}/feedback`, { helpful: fb.dataset.helpful === '1' }); return refresh(); }
  const au = e.target.closest('[data-auto]');
  if (au) { await api('POST', '/api/presence', { autoWeighIn: au.dataset.auto === '1' }); return refresh(); }
  const d = e.target.closest('[data-retire]');
  if (d) { await api('POST', `/api/decisions/${d.dataset.retire}/retire`); return refresh(); }
});

document.addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  try {
    if (f.id === 'whoForm') { ls.set('uid', document.getElementById('uid').value.trim().toLowerCase()); ls.set('uname', document.getElementById('uname').value.trim()); ls.set('utoken', document.getElementById('utoken').value); connect(); }
    if (f.id === 'newTask') { const v = document.getElementById('nt').value; if (v.trim()) await api('POST','/api/tasks',{ title:v, source:'web' }); }
    if (f.id === 'say') { const v = document.getElementById('sayInput').value; if (v.trim()) await api('POST',`/api/rooms/${encodeURIComponent(S.room)}/messages`,{ text:v }); }
    if (f.id === 'decide') { const v = document.getElementById('dec').value; if (v.trim()) await api('POST','/api/decisions',{ text:v }); }
    if (f.id === 'newRoom') { const v = document.getElementById('nr').value; if (v.trim()) { const r = await api('POST','/api/rooms',{ name:v }); S.room = r.id; } }
    if (f.dataset.invite) { const v = f.querySelector('input').value; if (v.trim()) await api('POST',`/api/rooms/${f.dataset.invite}/invite`,{ members: v }); }
    if (f.dataset.ask) { const v = f.querySelector('input').value; if (v.trim()) await api('POST','/api/requests',{ to:f.dataset.ask, text:v }); }
  } catch (err) { alertBox(err.message); }
  refresh();
});

function alertBox(msg){ const p = document.createElement('p'); p.className='empty'; p.setAttribute('role','alert'); p.textContent = msg; document.getElementById('app').prepend(p); }

let es;
function connect(){
  document.getElementById('uid').value = ls.get('uid'); document.getElementById('uname').value = ls.get('uname'); document.getElementById('utoken').value = ls.get('utoken');
  if (es) es.close();
  if (ls.get('uid')) {
    es = new EventSource('/api/stream?token=' + encodeURIComponent(ls.get('utoken')));
    let t; const later = () => { clearTimeout(t); t = setTimeout(refresh, 150); };
    ['task','person','message','decision','request','handoff','room'].forEach(ev => es.addEventListener(ev, later));
  }
  refresh();
}
connect();
setInterval(refresh, 30000);
</script>
</body>
</html>

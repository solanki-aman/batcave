<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Task lifecycle: backlog, claimed on claim, agent running on first edit, in review when a PR opens, done on merge. Cards move automatically.">
  <style>
    .m{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
    .card{animation:move 10s ease-in-out infinite}
    @keyframes move{
      0%,12%{transform:translate(64px,128px)}
      20%,32%{transform:translate(290px,128px)}
      40%,52%{transform:translate(516px,128px)}
      60%,72%{transform:translate(742px,128px)}
      80%,100%{transform:translate(968px,128px)}
    }
    .agent{animation:agent 10s step-end infinite}
    @keyframes agent{0%{opacity:0}40%{opacity:1}60%{opacity:0}}
  </style>
  <rect width="1200" height="260" rx="6" fill="#07090C"/>
  <rect x=".5" y=".5" width="1199" height="259" rx="6" fill="none" stroke="#8CC8D4" stroke-opacity=".18"/>
  <g class="m">
    <g font-size="12" letter-spacing="1" fill="#B9C6CC">
      <rect x="48" y="40" width="200" height="190" rx="3" fill="#0C1116" stroke="#8CC8D4" stroke-opacity=".12"/><text x="64" y="68">BACKLOG</text>
      <rect x="274" y="40" width="200" height="190" rx="3" fill="#0C1116" stroke="#8CC8D4" stroke-opacity=".12"/><text x="290" y="68">CLAIMED</text>
      <rect x="500" y="40" width="200" height="190" rx="3" fill="#0C1116" stroke="#8CC8D4" stroke-opacity=".12"/><text x="516" y="68">AGENT RUNNING</text>
      <rect x="726" y="40" width="200" height="190" rx="3" fill="#0C1116" stroke="#8CC8D4" stroke-opacity=".12"/><text x="742" y="68">IN REVIEW</text>
      <rect x="952" y="40" width="200" height="190" rx="3" fill="#0C1116" stroke="#8CC8D4" stroke-opacity=".12"/><text x="968" y="68">DONE</text>
    </g>
    <g font-size="11" fill="#4D5D66">
      <text x="64" y="94">/batcave:task</text>
      <text x="290" y="94">/batcave:claim</text>
      <text x="516" y="94">first edit (hook)</text>
      <text x="742" y="94">gh pr create (hook)</text>
      <text x="968" y="94">merge</text>
    </g>
    <g fill="#8CC8D4" fill-opacity=".3">
      <path d="M264 135 l-8 -5 v10 z"/><path d="M490 135 l-8 -5 v10 z"/><path d="M716 135 l-8 -5 v10 z"/><path d="M942 135 l-8 -5 v10 z"/>
    </g>
    <g class="card" transform="translate(64 128)">
      <rect width="168" height="76" rx="2" fill="#111920" stroke="#7CCFDC" stroke-opacity=".45"/>
      <text x="12" y="21" font-size="10" fill="#4D5D66">T-9 · plan step 4</text>
      <text x="12" y="42" font-size="13" fill="#D3DCE0">Dark mode receipts</text>
      <circle cx="21" cy="60" r="8" fill="none" stroke="#7CCFDC" stroke-opacity=".6"/><text x="21" y="63" text-anchor="middle" font-size="7" fill="#7CCFDC">AS</text>
      <g class="agent"><rect x="36" y="52" width="100" height="16" rx="1" fill="#D6A160" fill-opacity=".1"/><text x="86" y="64" text-anchor="middle" font-size="10" fill="#D6A160">agent running</text></g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Architecture: three teammates' machines, each running a different coding agent with Batcave hooks, MCP tools and a status line, exchange state with one Batcave server, which also feeds a web dashboard.">
  <style>
    .m{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
    .panel{fill:#0C1116;stroke:#8CC8D4;stroke-opacity:.2}
    .chip{fill:#111920;stroke:#8CC8D4;stroke-opacity:.1}
    .wire{stroke:#8CC8D4;stroke-opacity:.16;stroke-width:1;fill:none}
    .up{stroke:#D6A160;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-dasharray:2 18;animation:up 1.8s linear infinite;opacity:.8}
    .down{stroke:#7CCFDC;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-dasharray:2 18;animation:down 1.8s linear infinite;opacity:.8}
    @keyframes up{to{stroke-dashoffset:-20}}
    @keyframes down{to{stroke-dashoffset:20}}
    .breathe{animation:breathe 3s ease-in-out infinite}@keyframes breathe{50%{opacity:.35}}
  </style>
  <defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8CC8D4" stroke-opacity=".03"/></pattern></defs>
  <rect width="1200" height="600" rx="6" fill="#07090C"/>
  <rect width="1200" height="600" rx="6" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="1199" height="599" rx="6" fill="none" stroke="#8CC8D4" stroke-opacity=".18"/>
  <text x="48" y="60" class="m" font-size="13" fill="#4D5D66">$ <tspan fill="#7CCFDC">batcave --architecture</tspan></text>
  <text x="48" y="94" class="m" font-size="22" letter-spacing="1" fill="#D3DCE0">HOW BATCAVE FITS TOGETHER</text>
  <text x="48" y="120" class="m" font-size="13" fill="#8597A0">Work stays on each laptop. Only shared state travels.</text>

  <g class="m">
    <g transform="translate(48 150)">
      <rect class="panel" width="330" height="118" rx="3"/>
      <circle cx="28" cy="28" r="12" fill="none" stroke="#7CCFDC" stroke-opacity=".6"/><text x="28" y="32" text-anchor="middle" font-size="9" fill="#7CCFDC">AS</text>
      <text x="50" y="26" font-size="14" fill="#D3DCE0">aman</text>
      <text x="50" y="43" font-size="11" fill="#8597A0">claude code · own account</text>
      <rect class="chip" x="16" y="60" width="86" height="24" rx="2"/><text x="59" y="76" text-anchor="middle" font-size="11" fill="#8597A0">hooks</text>
      <rect class="chip" x="110" y="60" width="96" height="24" rx="2"/><text x="158" y="76" text-anchor="middle" font-size="11" fill="#8597A0">mcp tools</text>
      <rect class="chip" x="214" y="60" width="100" height="24" rx="2"/><text x="264" y="76" text-anchor="middle" font-size="11" fill="#8597A0">mod</text>
      <text x="16" y="104" font-size="10" fill="#4D5D66">branch aman/t-9-dark-mode</text>
    </g>
    <g transform="translate(48 290)">
      <rect class="panel" width="330" height="118" rx="3"/>
      <circle cx="28" cy="28" r="12" fill="none" stroke="#D6A160" stroke-opacity=".6"/><text x="28" y="32" text-anchor="middle" font-size="9" fill="#D6A160">TD</text>
      <text x="50" y="26" font-size="14" fill="#D3DCE0">tim</text>
      <text x="50" y="43" font-size="11" fill="#8597A0">codex cli · own account</text>
      <rect class="chip" x="16" y="60" width="86" height="24" rx="2"/><text x="59" y="76" text-anchor="middle" font-size="11" fill="#8597A0">hooks</text>
      <rect class="chip" x="110" y="60" width="96" height="24" rx="2"/><text x="158" y="76" text-anchor="middle" font-size="11" fill="#8597A0">mcp tools</text>
      <rect class="chip" x="214" y="60" width="100" height="24" rx="2"/><text x="264" y="76" text-anchor="middle" font-size="11" fill="#8597A0">AGENTS.md</text>
      <text x="16" y="104" font-size="10" fill="#4D5D66">branch tim/t-4-audit-tokens</text>
    </g>
    <g transform="translate(48 430)">
      <rect class="panel" width="330" height="118" rx="3"/>
      <circle cx="28" cy="28" r="12" fill="none" stroke="#B9C6CC" stroke-opacity=".5"/><text x="28" y="32" text-anchor="middle" font-size="9" fill="#B9C6CC">BG</text>
      <text x="50" y="26" font-size="14" fill="#D3DCE0">barbara</text>
      <text x="50" y="43" font-size="11" fill="#8597A0">cursor · own account</text>
      <rect class="chip" x="16" y="60" width="86" height="24" rx="2"/><text x="59" y="76" text-anchor="middle" font-size="11" fill="#8597A0">hooks</text>
      <rect class="chip" x="110" y="60" width="96" height="24" rx="2"/><text x="158" y="76" text-anchor="middle" font-size="11" fill="#8597A0">mcp tools</text>
      <rect class="chip" x="214" y="60" width="100" height="24" rx="2"/><text x="264" y="76" text-anchor="middle" font-size="11" fill="#8597A0">commands</text>
      <text x="16" y="104" font-size="10" fill="#4D5D66">branch barbara/t-5-copy-pass</text>
    </g>
  </g>

  <path class="wire" d="M378 209 C 450 209, 470 330, 540 340"/>
  <path class="wire" d="M378 349 C 450 349, 480 360, 540 360"/>
  <path class="wire" d="M378 489 C 450 489, 470 390, 540 380"/>
  <path class="up" d="M378 203 C 450 203, 470 324, 540 334"/>
  <path class="down" d="M378 215 C 450 215, 470 336, 540 346"/>
  <path class="up" d="M378 343 C 450 343, 480 354, 540 354"/>
  <path class="down" d="M378 355 C 450 355, 480 366, 540 366"/>
  <path class="up" d="M378 483 C 450 483, 470 384, 540 374"/>
  <path class="down" d="M378 495 C 450 495, 470 396, 540 386"/>

  <g class="m" font-size="11" fill="#8597A0">
    <line x1="560" y1="566" x2="584" y2="566" stroke="#D6A160" stroke-width="1.6" stroke-dasharray="2 5" stroke-linecap="round"/>
    <text x="592" y="570">presence, edits, commits, PRs</text>
    <line x1="820" y1="566" x2="844" y2="566" stroke="#7CCFDC" stroke-width="1.6" stroke-dasharray="2 5" stroke-linecap="round"/>
    <text x="852" y="570">context, decisions, requests, guard</text>
  </g>

  <g transform="translate(540 186)" class="m">
    <rect width="330" height="340" rx="3" fill="#0A0E12" stroke="#7CCFDC" stroke-opacity=".45"/>
    <path d="M0 3V0H14M316 0H330V14M330 326V340H316M14 340H0V326" fill="none" stroke="#7CCFDC" stroke-width="1.5" transform="translate(-.5 -.5)"/>
    <circle cx="24" cy="30" r="3.5" fill="#8DC5A0" class="breathe"/>
    <text x="36" y="35" font-size="14" letter-spacing="1" fill="#D3DCE0">BATCAVE SERVER</text>
    <text x="24" y="58" font-size="11" fill="#8597A0">one per team · node · zero deps</text>
    <g font-size="11" fill="#B9C6CC" text-anchor="middle">
      <rect class="chip" x="24" y="80" width="134" height="30" rx="2"/><text x="91" y="99">board + claims</text>
      <rect class="chip" x="172" y="80" width="134" height="30" rx="2"/><text x="239" y="99">people</text>
      <rect class="chip" x="24" y="120" width="134" height="30" rx="2"/><text x="91" y="139">rooms</text>
      <rect class="chip" x="172" y="120" width="134" height="30" rx="2"/><text x="239" y="139">decisions</text>
      <rect class="chip" x="24" y="160" width="134" height="30" rx="2"/><text x="91" y="179">requests</text>
      <rect class="chip" x="172" y="160" width="134" height="30" rx="2"/><text x="239" y="179">handoffs</text>
      <rect class="chip" x="24" y="200" width="134" height="30" rx="2"/><text x="91" y="219">guard</text>
      <rect class="chip" x="172" y="200" width="134" height="30" rx="2"/><text x="239" y="219">stats</text>
    </g>
    <line x1="24" y1="250" x2="306" y2="250" stroke="#8CC8D4" stroke-opacity=".14"/>
    <text x="24" y="276" font-size="11" fill="#8597A0">json api · sse stream</text>
    <text x="24" y="296" font-size="11" fill="#8597A0">alfred <tspan fill="#4D5D66">(optional, local)</tspan></text>
    <text x="24" y="316" font-size="11" fill="#4D5D66">data/batcave.json</text>
  </g>

  <path class="wire" d="M870 356 L 940 356"/>
  <path class="down" d="M870 356 L 940 356" style="animation-direction:reverse"/>

  <g transform="translate(940 246)" class="m">
    <rect class="panel" width="212" height="220" rx="3"/>
    <line x1="0" y1="30" x2="212" y2="30" stroke="#8CC8D4" stroke-opacity=".14"/>
    <text x="14" y="20" font-size="10" fill="#4D5D66">localhost:4777</text>
    <text x="14" y="56" font-size="13" fill="#D3DCE0">dashboard</text>
    <text x="14" y="74" font-size="10" fill="#8597A0">for PMs and designers</text>
    <g fill="#111920" stroke="#8CC8D4" stroke-opacity=".1">
      <rect x="14" y="90" width="40" height="112" rx="2"/><rect x="60" y="90" width="40" height="112" rx="2"/>
      <rect x="106" y="90" width="40" height="112" rx="2"/><rect x="152" y="90" width="40" height="112" rx="2"/>
    </g>
    <g fill="#18222A">
      <rect x="20" y="98" width="28" height="16" rx="1"/><rect x="20" y="120" width="28" height="16" rx="1"/>
      <rect x="66" y="98" width="28" height="16" rx="1"/>
      <rect x="112" y="98" width="28" height="16" rx="1" stroke="#D6A160" stroke-opacity=".7"/><rect x="112" y="120" width="28" height="16" rx="1"/>
      <rect x="158" y="98" width="28" height="16" rx="1"/>
    </g>
  </g>
</svg>

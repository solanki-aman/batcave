<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Architecture: three teammates' machines, each running Claude Code with Batcave hooks, MCP tools and a status line, exchange state with one Batcave server, which also feeds a web dashboard.">
  <style>
    .serif{font-family:Georgia,'Times New Roman',serif}
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .mono{font-family:'SF Mono',Menlo,Consolas,monospace}
    .card{fill:#FFFFFF;stroke:#DEDCD1}
    .chip{fill:#F5F4ED}
    .wire{stroke:#C2C0B6;stroke-width:1.5;fill:none}
    .up{stroke:#D97757;stroke-width:3;fill:none;stroke-linecap:round;stroke-dasharray:2 22;animation:up 1.4s linear infinite}
    .down{stroke:#141413;stroke-width:3;fill:none;stroke-linecap:round;stroke-dasharray:2 22;animation:down 1.4s linear infinite}
    @keyframes up{to{stroke-dashoffset:-24}}
    @keyframes down{to{stroke-dashoffset:24}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.35}}
  </style>
  <rect width="1200" height="600" rx="20" fill="#FAF9F5"/>
  <text x="48" y="58" class="serif" font-size="30" fill="#141413">How Batcave fits together</text>
  <text x="48" y="88" class="sans" font-size="16" fill="#5E5D59">Work stays on each laptop. Only shared state travels.</text>

  <!-- machines -->
  <g class="sans">
    <g transform="translate(48 120)">
      <rect class="card" width="330" height="130" rx="14"/>
      <circle cx="30" cy="32" r="14" fill="#141413"/><text x="30" y="36" text-anchor="middle" font-size="10" font-weight="700" fill="#FAF9F5">AS</text>
      <text x="54" y="30" font-size="15" font-weight="600" fill="#141413">Aman's machine</text>
      <text x="54" y="48" font-size="12" fill="#5E5D59">Claude Code · Aman's own subscription</text>
      <rect class="chip" x="16" y="70" width="88" height="28" rx="8"/><text x="60" y="89" text-anchor="middle" font-size="13" fill="#3D3D3A">hooks</text>
      <rect class="chip" x="112" y="70" width="104" height="28" rx="8"/><text x="164" y="89" text-anchor="middle" font-size="13" fill="#3D3D3A">MCP tools</text>
      <rect class="chip" x="224" y="70" width="90" height="28" rx="8"/><text x="269" y="89" text-anchor="middle" font-size="13" fill="#3D3D3A">status line</text>
      <text x="16" y="118" class="mono" font-size="11" fill="#87867F">repo · branch aman/t-9-dark-mode</text>
    </g>
    <g transform="translate(48 270)">
      <rect class="card" width="330" height="130" rx="14"/>
      <circle cx="30" cy="32" r="14" fill="#87867F"/><text x="30" y="36" text-anchor="middle" font-size="10" font-weight="700" fill="#141413">NK</text>
      <text x="54" y="30" font-size="15" font-weight="600" fill="#141413">Nate's machine</text>
      <text x="54" y="48" font-size="12" fill="#5E5D59">Claude Code · Nate's own subscription</text>
      <rect class="chip" x="16" y="70" width="88" height="28" rx="8"/><text x="60" y="89" text-anchor="middle" font-size="13" fill="#3D3D3A">hooks</text>
      <rect class="chip" x="112" y="70" width="104" height="28" rx="8"/><text x="164" y="89" text-anchor="middle" font-size="13" fill="#3D3D3A">MCP tools</text>
      <rect class="chip" x="224" y="70" width="90" height="28" rx="8"/><text x="269" y="89" text-anchor="middle" font-size="13" fill="#3D3D3A">status line</text>
      <text x="16" y="118" class="mono" font-size="11" fill="#87867F">repo · branch nate/t-4-audit-tokens</text>
    </g>
    <g transform="translate(48 420)">
      <rect class="card" width="330" height="130" rx="14"/>
      <circle cx="30" cy="32" r="14" fill="#E3DACC"/><text x="30" y="36" text-anchor="middle" font-size="10" font-weight="700" fill="#141413">PR</text>
      <text x="54" y="30" font-size="15" font-weight="600" fill="#141413">Priya's machine</text>
      <text x="54" y="48" font-size="12" fill="#5E5D59">Claude Code · Priya's own subscription</text>
      <rect class="chip" x="16" y="70" width="88" height="28" rx="8"/><text x="60" y="89" text-anchor="middle" font-size="13" fill="#3D3D3A">hooks</text>
      <rect class="chip" x="112" y="70" width="104" height="28" rx="8"/><text x="164" y="89" text-anchor="middle" font-size="13" fill="#3D3D3A">MCP tools</text>
      <rect class="chip" x="224" y="70" width="90" height="28" rx="8"/><text x="269" y="89" text-anchor="middle" font-size="13" fill="#3D3D3A">status line</text>
      <text x="16" y="118" class="mono" font-size="11" fill="#87867F">repo · branch priya/t-5-copy-pass</text>
    </g>
  </g>

  <!-- wires machines <-> server -->
  <path class="wire" d="M378 175 C 450 175, 470 300, 540 315"/>
  <path class="wire" d="M378 335 C 450 335, 480 335, 540 335"/>
  <path class="wire" d="M378 485 C 450 485, 470 370, 540 355"/>
  <path class="up" d="M378 168 C 450 168, 470 293, 540 308"/>
  <path class="down" d="M378 182 C 450 182, 470 307, 540 322"/>
  <path class="up" d="M378 328 C 450 328, 480 328, 540 328"/>
  <path class="down" d="M378 342 C 450 342, 480 342, 540 342"/>
  <path class="up" d="M378 478 C 450 478, 470 363, 540 348"/>
  <path class="down" d="M378 492 C 450 492, 470 377, 540 362"/>

  <!-- legend for wires -->
  <g class="sans" font-size="12" fill="#5E5D59">
    <line x1="404" y1="566" x2="430" y2="566" stroke="#D97757" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/>
    <text x="438" y="570">presence, edits, commits, PRs</text>
    <line x1="640" y1="566" x2="666" y2="566" stroke="#141413" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/>
    <text x="674" y="570">context, decisions, requests, guard</text>
  </g>

  <!-- server -->
  <g transform="translate(540 160)" class="sans">
    <rect width="330" height="350" rx="16" fill="#141413"/>
    <circle cx="28" cy="34" r="5" fill="#9DB97A" class="pulse"/>
    <text x="42" y="40" font-size="17" font-weight="600" fill="#FAF9F5">Batcave server</text>
    <text x="24" y="66" font-size="12" fill="#B0AEA5">One per team · Node, zero dependencies</text>
    <g font-size="13" fill="#F0EEE6">
      <rect x="24" y="88" width="134" height="34" rx="8" fill="#262624"/><text x="91" y="110" text-anchor="middle">Board + claims</text>
      <rect x="172" y="88" width="134" height="34" rx="8" fill="#262624"/><text x="239" y="110" text-anchor="middle">People</text>
      <rect x="24" y="132" width="134" height="34" rx="8" fill="#262624"/><text x="91" y="154" text-anchor="middle">Rooms</text>
      <rect x="172" y="132" width="134" height="34" rx="8" fill="#262624"/><text x="239" y="154" text-anchor="middle">Decisions</text>
      <rect x="24" y="176" width="134" height="34" rx="8" fill="#262624"/><text x="91" y="198" text-anchor="middle">Requests</text>
      <rect x="172" y="176" width="134" height="34" rx="8" fill="#262624"/><text x="239" y="198" text-anchor="middle">Handoffs</text>
      <rect x="24" y="220" width="134" height="34" rx="8" fill="#262624"/><text x="91" y="242" text-anchor="middle">Guard</text>
      <rect x="172" y="220" width="134" height="34" rx="8" fill="#262624"/><text x="239" y="242" text-anchor="middle">Pulse</text>
    </g>
    <line x1="24" y1="276" x2="306" y2="276" stroke="#3D3D3A"/>
    <text x="24" y="304" class="mono" font-size="12" fill="#B0AEA5">JSON API · SSE stream</text>
    <text x="24" y="326" class="mono" font-size="12" fill="#B0AEA5">data/batcave.json</text>
  </g>

  <!-- server -> dashboard -->
  <path class="wire" d="M870 335 L 940 335"/>
  <path class="down" d="M870 335 L 940 335" style="animation-direction:reverse"/>

  <!-- dashboard -->
  <g transform="translate(940 220)" class="sans">
    <rect class="card" width="212" height="230" rx="14"/>
    <circle cx="20" cy="20" r="4" fill="#DEDCD1"/><circle cx="34" cy="20" r="4" fill="#DEDCD1"/><circle cx="48" cy="20" r="4" fill="#DEDCD1"/>
    <line x1="0" y1="36" x2="212" y2="36" stroke="#E8E6DC"/>
    <text x="16" y="62" font-size="15" font-weight="600" fill="#141413">Web dashboard</text>
    <text x="16" y="82" font-size="12" fill="#5E5D59">For PMs and designers</text>
    <g>
      <rect x="16" y="98" width="40" height="110" rx="6" fill="#F0EEE6"/>
      <rect x="22" y="106" width="28" height="18" rx="3" fill="#FFFFFF"/><rect x="22" y="130" width="28" height="18" rx="3" fill="#FFFFFF"/>
      <rect x="62" y="98" width="40" height="110" rx="6" fill="#F0EEE6"/>
      <rect x="68" y="106" width="28" height="18" rx="3" fill="#FFFFFF"/>
      <rect x="108" y="98" width="40" height="110" rx="6" fill="#F0EEE6"/>
      <rect x="114" y="106" width="28" height="18" rx="3" fill="#FFFFFF" stroke="#D97757"/><rect x="114" y="130" width="28" height="18" rx="3" fill="#FFFFFF"/>
      <rect x="154" y="98" width="40" height="110" rx="6" fill="#F0EEE6"/>
      <rect x="160" y="106" width="28" height="18" rx="3" fill="#FFFFFF"/>
    </g>
  </g>
</svg>

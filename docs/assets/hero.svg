<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Batcave. Your agents, on the same team. One board, live presence, shared decisions and a guard for every coding agent on your team.">
  <style>
    .m{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
    .hair{stroke:#8CC8D4;stroke-opacity:.14;fill:none}
    .wire{stroke:#8CC8D4;stroke-opacity:.22;stroke-width:1;fill:none}
    .sig{fill:none;stroke-width:1.4;stroke-linecap:round;stroke-dasharray:3 200;animation:sig 5s linear infinite}
    .in{stroke:#7CCFDC}.out{stroke:#D6A160;animation-direction:reverse}
    .s2{animation-delay:-1s}.s3{animation-delay:-2s}.s4{animation-delay:-3s}.s5{animation-delay:-4s}
    @keyframes sig{to{stroke-dashoffset:-203}}
    .blink{animation:blink 1.2s steps(1) infinite}@keyframes blink{50%{opacity:0}}
    .breathe{animation:breathe 4s ease-in-out infinite}@keyframes breathe{50%{opacity:.35}}
  </style>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8CC8D4" stroke-opacity=".035"/></pattern>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7CCFDC" stop-opacity="0"/><stop offset="1" stop-color="#7CCFDC" stop-opacity=".04"/></linearGradient>
    <clipPath id="clip"><rect width="1200" height="420" rx="6"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="420" fill="#07090C"/>
    <rect width="1200" height="420" fill="url(#grid)"/>

    <!-- perspective floor on the right -->
    <rect x="640" y="250" width="560" height="170" fill="url(#floor)"/>
    <g class="hair">
      <path d="M640 250H1200"/>
      <path d="M920 250 640 340M920 250 640 420M920 250 760 420M920 250 860 420M920 250 920 420M920 250 980 420M920 250 1080 420M920 250 1200 420M920 250 1200 340"/>
      <path d="M680 270H1160M700 292H1140M720 322H1120M740 362H1100M760 410H1080" stroke-opacity=".09"/>
    </g>

    <!-- team: hairline wires into one node -->
    <g>
      <path class="wire" d="M780 110 L920 190"/><path class="wire" d="M1070 96 L920 190"/>
      <path class="wire" d="M740 220 L920 190"/><path class="wire" d="M1100 214 L920 190"/>
      <path class="sig in" d="M780 110 L920 190"/><path class="sig out s2" d="M920 190 L1070 96"/>
      <path class="sig in s3" d="M740 220 L920 190"/><path class="sig in s4" d="M1100 214 L920 190"/>
      <g class="m" font-size="11" text-anchor="middle">
        <circle cx="780" cy="110" r="17" fill="#0C1116" stroke="#7CCFDC" stroke-opacity=".6"/><text x="780" y="114" fill="#7CCFDC">AS</text>
        <circle cx="1070" cy="96" r="17" fill="#0C1116" stroke="#D6A160" stroke-opacity=".6"/><text x="1070" y="100" fill="#D6A160">TD</text>
        <circle cx="740" cy="220" r="17" fill="#0C1116" stroke="#B9C6CC" stroke-opacity=".45"/><text x="740" y="224" fill="#B9C6CC">BG</text>
        <circle cx="1100" cy="214" r="17" fill="#0C1116" stroke="#8DC5A0" stroke-opacity=".5"/><text x="1100" y="218" fill="#8DC5A0">LF</text>
      </g>
      <circle cx="920" cy="190" r="26" fill="none" stroke="#7CCFDC" stroke-opacity=".18" class="breathe"/>
      <circle cx="920" cy="190" r="18" fill="#0C1116" stroke="#7CCFDC" stroke-opacity=".7"/>
      <path d="M920 182 913 195h14Z" fill="none" stroke="#7CCFDC" stroke-width="1.2"/>
      <circle cx="920" cy="250" r="2.5" fill="#7CCFDC" fill-opacity=".8"/>
      <path class="hair" d="M920 208V248" stroke-dasharray="2 4"/>
    </g>

    <!-- copy -->
    <text x="64" y="82" class="m" font-size="13" fill="#4D5D66">$ <tspan fill="#7CCFDC">batcave --version</tspan><tspan fill="#8597A0">  v0.4 · open source · MIT</tspan></text>
    <text x="62" y="152" class="m" font-size="46" font-weight="500" letter-spacing="2" fill="#D3DCE0">YOUR AGENTS,</text>
    <text x="62" y="210" class="m" font-size="46" font-weight="500" letter-spacing="2" fill="#D3DCE0">ON THE <tspan fill="#7CCFDC">SAME TEAM.</tspan></text>
    <rect x="574" y="176" width="16" height="36" fill="#7CCFDC" fill-opacity=".7" class="blink"/>
    <text x="64" y="262" class="m" font-size="15" fill="#8597A0">One board, live presence, shared decisions and a guard</text>
    <text x="64" y="286" class="m" font-size="15" fill="#8597A0">for every coding agent on your team.</text>

    <g transform="translate(64 322)">
      <rect width="448" height="40" rx="2" fill="#0C1116" stroke="#8CC8D4" stroke-opacity=".22"/>
      <circle cx="20" cy="20" r="3.5" fill="#8DC5A0" class="breathe"/>
      <text x="34" y="25" class="m" font-size="13" fill="#D3DCE0">wayne-tech <tspan fill="#4D5D66">·</tspan> <tspan fill="#8597A0">5 online</tspan> <tspan fill="#4D5D66">·</tspan> <tspan fill="#D6A160">1 request</tspan> <tspan fill="#4D5D66">·</tspan> <tspan fill="#8597A0">T-9 running</tspan></text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="419" rx="6" fill="none" stroke="#8CC8D4" stroke-opacity=".18"/>
</svg>
